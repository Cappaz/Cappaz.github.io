<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Viewer 3D</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
  <!-- Includi Three.js e GLTFLoader dalla stessa versione su CDN -->
  <script src="https://unpkg.com/three@0.124.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.124.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://unpkg.com/three@0.124.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<script>
  // Setup base: scena, camera, renderer
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Aggiungi luce ambientale
  const light = new THREE.HemisphereLight(0xffffff, 0x444444);
  light.position.set(0, 200, 0);
  scene.add(light);

  // Controlli orbitali (facoltativi)
  const controls = new THREE.OrbitControls(camera, renderer.domElement);

  // Carica il modello glTF/GLB (assumendo che 'modello.glb' sia in root del sito)
  const loader = new THREE.GLTFLoader();
  loader.load('modello.glb',
    function (gltf) {
      scene.add(gltf.scene);
      // Posiziona la camera in modo da inquadrare il modello
      camera.position.set(0, 1.6, 3);
      animate();
    },
    undefined,
    function (error) {
      console.error('Errore nel caricamento:', error);
    }
  );

  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }
</script>
</body>
</html>
